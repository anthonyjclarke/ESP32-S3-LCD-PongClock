; PlatformIO Project Configuration File
;
; Two boards, one firmware. Pick the board with -e:
;   pio run -e waveshare_lcd316 -t upload      (Waveshare ESP32-S3-LCD-3.16)
;   pio run -e tdisplay_s3      -t upload      (LilyGO T-Display-S3)
; Plain `pio run -t upload` uses default_envs below.
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = waveshare_lcd316

; ── Shared by every board ─────────────────────────────────────────────────────
[env]
; Pinned: pioarduino build of Arduino-ESP32 3.3.7 (IDF 5.5.2). An unpinned
; `espressif32` silently picks whichever platform version is installed.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.filesystem = littlefs
lib_deps =
  lovyan03/LovyanGFX@1.2.32
  tzapu/WiFiManager@2.0.17
  ropg/ezTime@0.8.3
  bblanchon/ArduinoJson@^6.21.0
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DDEBUG_LEVEL=3

; ── Waveshare ESP32-S3-LCD-3.16 (ST7701 RGB 320×820) ──────────────────────────
[env:waveshare_lcd316]
board = esp32-s3-devkitm-1
monitor_port = /dev/cu.usbmodem2301
upload_port = /dev/cu.usbmodem2301
upload_speed = 115200
; ROM bootloader: the stub flasher drops USB CDC mid-uploadfs on this board
upload_flags = --no-stub
build_flags =
  ${env.build_flags}
  -DBOARD_WAVESHARE_LCD316

; ── LilyGO T-Display-S3 (ST7789 i8080 170×320) ────────────────────────────────
[env:tdisplay_s3]
board = lilygo-t-display-s3
; ROM bootloader: as on the Waveshare, the stub flasher stops responding
; during uploadfs over USB CDC (firmware upload alone works either way)
upload_flags = --no-stub
build_flags =
  ${env.build_flags}
  -DBOARD_TDISPLAY_S3
